# HTTPS am Ingress. ANNAHMEN (an den Cluster anpassen):
#   - Ingress-Controller ingress-nginx (ingressClassName: nginx)
#   - cert-manager mit ClusterIssuer „letsencrypt“ stellt das Zertifikat aus
# Die Overlays setzen Hostnamen und TLS-Secret je Umgebung. Wer die Gateway
# API nutzt, ersetzt diese Datei durch eine HTTPRoute (Docker.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kneipe-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Bild-Uploads im Admin (PHP_POST_MAX_SIZE)
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.example.org
      secretName: kneipe-web-tls
  rules:
    - host: www.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kneipe-web
                port:
                  name: http
