# VORLAGE – nie mit echten Werten committen und nicht in kustomization.yaml
# aufnehmen. Das Secret wird je Umgebung einmal angelegt, z. B.:
#
#   kubectl -n kneipe create secret generic kneipe-web-secrets \
#     --from-literal=GRAV_NONCE_KEY="$(openssl rand -hex 32)" \
#     --from-literal=GRAV_API_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GRAV_CONFIG__plugins__email__mailer__smtp__password='…' \
#     --from-literal=KNEIPE_ADMIN_USERNAME='admin' \
#     --from-literal=KNEIPE_ADMIN_EMAIL='…' \
#     --from-literal=KNEIPE_ADMIN_PASSWORD='…'
#
# oder mit Sealed Secrets / External Secrets / SOPS (Docker.md, Abschnitt
# „Secrets“). Das Deployment startet ohne dieses Secret nicht.
apiVersion: v1
kind: Secret
metadata:
  name: kneipe-web-secrets
type: Opaque
stringData:
  # je mindestens 32 Zeichen; für alle Pods gleich (CSRF-Nonces, Admin-Anmeldung)
  GRAV_NONCE_KEY: "<ersetzen: openssl rand -hex 32>"
  GRAV_API_JWT_SECRET: "<ersetzen: openssl rand -hex 32>"
  # SMTP-Passwort des Absenderkontos
  GRAV_CONFIG__plugins__email__mailer__smtp__password: "<ersetzen>"
  # Erstes Administrationskonto – wird nur angelegt, wenn noch kein Konto
  # existiert. Nach dem ersten Start kann es aus dem Secret entfernt werden.
  KNEIPE_ADMIN_USERNAME: "admin"
  KNEIPE_ADMIN_EMAIL: "<ersetzen>"
  KNEIPE_ADMIN_PASSWORD: "<ersetzen: mindestens 12 Zeichen>"
