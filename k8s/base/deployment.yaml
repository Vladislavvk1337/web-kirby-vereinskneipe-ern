# Website (Grav + Apache/mod_php) als ein Pod mit persistentem Volume.
# Erfüllt Pod Security „restricted“: nicht root, keine Capabilities,
# schreibgeschütztes Dateisystem (beschreibbar nur /data und /tmp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kneipe-web
spec:
  # ReadWriteOnce-Volume und Dateispeicher ohne Sperren über Pods hinweg:
  # genau eine Instanz. Rolling Update ohne Überlappung: der alte Pod endet,
  # bevor der neue das Volume einhängt (kurze Unterbrechung, Docker.md).
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/vladislavvk1337/web-kirby-vereinskneipe-ern:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kneipe-web-config
            - secretRef:
                name: kneipe-web-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          # Start: bis zu 2 Minuten (erster Start kopiert Beispielinhalte,
          # Grav baut seine Caches); erst danach greifen Liveness/Readiness
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 24
          # Läuft nicht mehr: PHP/Apache antworten nicht → Neustart
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Bereit: Inhalte und Konto vorhanden, Volume beschreibbar
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kneipe-web-data
        # Cache, Sitzungen, Bildvarianten, Apache-Laufzeit – flüchtig
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
