# Umgebung „production“:
#   kubectl apply -k k8s/overlays/production
# Vorher das Secret kneipe-web-secrets im Namespace kneipe anlegen
# (k8s/base/secret.example.yaml). Hostname und Image-Tag sind PLATZHALTER.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kneipe

resources:
  - ../../base

images:
  - name: ghcr.io/vladislavvk1337/web-kirby-vereinskneipe-ern
    # Produktion: immer eine feste Version (Git-Tag v1.0.0 → Image 1.0.0,
    # siehe .github/workflows/docker.yml) – nie „latest“. PLATZHALTER.
    newTag: "1.0.0"

patches:
  - target:
      kind: ConfigMap
      name: kneipe-web-config
    patch: |-
      - op: replace
        path: /data/GRAV_ENVIRONMENT
        value: production
      - op: replace
        path: /data/GRAV_CONFIG__system__custom_base_url
        value: https://www.example.org
      - op: replace
        path: /data/GRAV_CONFIG__plugins__login__site_host
        value: https://www.example.org
      - op: replace
        path: /data/KNEIPE_NOINDEX
        value: "false"
  - target:
      kind: Ingress
      name: kneipe-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.example.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.example.org
  - target:
      kind: PersistentVolumeClaim
      name: kneipe-web-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Deployment
      name: kneipe-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 768Mi
