; Verwaltet von deploy/server-setup.sh – nicht von Hand ändern.
; Eigener PHP-FPM-Pool für Kirby ({{DOMAIN}}). Die allgemeine Härtung
; (php.ini) kommt von basis-schutz-os; hier nur, was Kirby zusätzlich braucht.
[kirby-{{SITE_ID}}]
user  = www-data
group = www-data

listen = {{KIRBY_SOCKET}}
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

security.limit_extensions = .php
clear_env = yes

; Pfade und nicht geheime Werte. Geheimnisse stehen in kirby.env.
env[KIRBY_ENV_FILE]     = {{CONFIG_DIR}}/kirby.env
env[KIRBY_CONTENT_ROOT] = {{DATA_DIR}}/content
env[KIRBY_MEDIA_ROOT]   = {{DATA_DIR}}/media
env[KIRBY_STORAGE_ROOT] = {{DATA_DIR}}/storage
env[KIRBY_URL]          = {{SITE_URL}}
env[KIRBY_NOINDEX]      = {{NOINDEX}}

; PHP darf nur Programmcode, Daten, Konfiguration und /tmp lesen
php_admin_value[open_basedir] = {{APP_DIR}}/:{{DATA_DIR}}/:{{CONFIG_DIR}}/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid

; Uploads im Panel (Bilder bis 10 MB; Blueprints begrenzen zusätzlich)
php_admin_flag[file_uploads] = on
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_input_vars] = 2000
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[memory_limit] = 256M

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm-kirby-{{SITE_ID}}.log
