# Verwaltet von basis-schutz-os – globale nginx-Einstellungen (http-Kontext)

server_tokens off;
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 15s;

# Rate-Limit für die PHP-API
limit_req_zone $binary_remote_addr zone=api:10m rate=${API_RATE};
limit_req_status 429;

# TLS-Einstellungen: siehe snippets/basis-schutz-tls.conf (im HTTPS-Server eingebunden,
# da die Debian/Ubuntu-nginx.conf ssl_protocols bereits im http-Block setzt)
