# Verwaltet von basis-schutz-os – ${DOMAIN} (nur HTTP, noch kein Zertifikat)
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAMES};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include snippets/${SITE_ID}-site.conf;
}
