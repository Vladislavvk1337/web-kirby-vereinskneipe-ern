# Verwaltet von basis-schutz-os – Inhalt der Webseite ${DOMAIN}
root ${SITE_ROOT};
index index.html;
charset utf-8;

include snippets/basis-schutz-headers.conf;

access_log /var/log/nginx/${SITE_ID}.access.log;

# Versteckte Dateien (.git, .env, .DS_Store …) nie ausliefern
location ~ /\.(?!well-known/) {
    return 404;
}

${PHP_INCLUDE}

# Außerhalb von /api/ wird niemals PHP ausgeführt oder ausgeliefert
location ~* \.(php|phtml|phar|inc)$ {
    return 404;
}

# Astro-Assets haben Hash im Dateinamen -> dauerhaft cachen
location ^~ /_astro/ {
    include snippets/basis-schutz-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Statische Seiten: /about -> /about/index.html oder /about.html
location / {
    try_files $uri $uri/ $uri.html =404;
}

error_page 404 /404.html;
