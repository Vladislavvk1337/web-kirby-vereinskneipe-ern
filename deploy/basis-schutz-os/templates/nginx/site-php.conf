# Verwaltet von basis-schutz-os – PHP-API für ${DOMAIN}
# Nur Dateien direkt in ${API_ROOT}/public sind aufrufbar: /api/<name>.php
location ~ ^/api/(?<api_script>[A-Za-z0-9_-]+\.php)$ {
    limit_req zone=api burst=${API_BURST} nodelay;
    root ${API_ROOT}/public;
    try_files /$api_script =404;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/$api_script;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:${PHP_SOCKET};
}

location /api/ {
    return 404;
}
