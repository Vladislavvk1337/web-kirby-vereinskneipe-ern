# Verwaltet von basis-schutz-os – manuelle Änderungen werden überschrieben.
# Dateiname beginnt mit 00-, weil in sshd der ERSTE gefundene Wert gilt
# (überstimmt so z. B. 50-cloud-init.conf mit "PasswordAuthentication yes").

Port ${SSH_PORT}

# Kein Root-Login, nur noch der Admin-Benutzer
PermitRootLogin no
AllowUsers ${ADMIN_USER}

# Ausschließlich Public-Key-Authentifizierung
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Angriffsfläche reduzieren
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
LogLevel VERBOSE
