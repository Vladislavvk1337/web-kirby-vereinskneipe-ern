; Verwaltet von basis-schutz-os – gilt nur für PHP-FPM (nicht für die CLI/Composer)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_fopen = Off
allow_url_include = Off

; Kontaktformular braucht keine Datei-Uploads
file_uploads = Off
post_max_size = 1M
upload_max_filesize = 1M
max_input_vars = 100
max_execution_time = 30
max_input_time = 30
memory_limit = 128M

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
