; Verwaltet von basis-schutz-os – PHP-FPM-Pool für ${DOMAIN}
[${SITE_ID}]
user  = www-data
group = www-data

listen = ${PHP_SOCKET}
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Prozesse nur bei Bedarf starten – ideal für ein Kontaktformular
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 200

security.limit_extensions = .php
clear_env = yes

; PHP darf nur sein eigenes Verzeichnis lesen
php_admin_value[open_basedir] = ${API_ROOT}/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid
php_admin_value[error_log] = /var/log/php-fpm-${SITE_ID}.log
php_admin_flag[log_errors] = on
