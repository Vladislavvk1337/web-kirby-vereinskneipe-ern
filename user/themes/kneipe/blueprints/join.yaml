# Admin2-Formular für Seiten mit Template „join“ (Theme kneipe).
title: Mitmachen
form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        inhalt:
          type: tab
          title: Inhalt
          fields:
            admin:
              type: display
              markdown: true
              content: Diese Seite bearbeitet nur die **Administration**.
            header.title:
              type: text
              label: Titel
              autofocus: true
              validate:
                required: true
            header.intro:
              type: textarea
              label: Einleitung
              rows: 3
            header.steps:
              type: list
              label: Ablauf
              style: vertical
              fields:
                .title:
                  type: text
                  label: Titel
                .text:
                  type: textarea
                  label: Text
                  rows: 3
            header.helpers:
              type: markdown
              label: Einzeln helfen
              validate:
                type: textarea
                max: 0
            header.faq:
              type: list
              label: Häufige Fragen
              style: vertical
              fields:
                .question:
                  type: text
                  label: Frage
                .answer:
                  type: textarea
                  label: Antwort
                  rows: 3
            header.seotitle:
              type: text
              label: Titel für Suchmaschinen (optional)
            header.seodescription:
              type: textarea
              label: Beschreibung für Suchmaschinen (optional)
              rows: 2
            header.noindex:
              type: toggle
              label: Nicht in Suchmaschinen aufnehmen
              default: 0
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
        optionen:
          type: tab
          title: Veröffentlichung
          fields:
            header.published:
              type: toggle
              label: Veröffentlicht
              default: 1
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
