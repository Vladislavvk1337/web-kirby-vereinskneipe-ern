# Admin2-Formular für Seiten mit Template „home“ (Theme kneipe).
title: Startseite
form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        inhalt:
          type: tab
          title: Startseite
          fields:
            admin:
              type: display
              markdown: true
              content: Diese Seite bearbeitet nur die **Administration**.
            header.title:
              type: text
              label: Titel
              autofocus: true
              validate:
                required: true
            header.intro:
              type: textarea
              label: Einleitung unter dem Claim
              rows: 3
            header.modelheadline:
              type: text
              label: Überschrift „So funktioniert es“
            header.modelsteps:
              type: list
              label: Schritte
              style: vertical
              fields:
                .title:
                  type: text
                  label: Titel
                .text:
                  type: textarea
                  label: Text
                  rows: 3
            header.photo:
              type: filepicker
              label: Foto
              folder: '@self'
              preview_images: true
              accept:
              - .jpg
              - .jpeg
              - .png
              - .webp
            header.photocaption:
              type: text
              label: Bildunterschrift
            header.joinheadline:
              type: text
              label: Überschrift „Mitmachen“
            header.jointext:
              type: textarea
              label: Text „Mitmachen“
              rows: 3
            header.media_order:
              type: pagemedia
              label: Bilder hochladen
            header.seotitle:
              type: text
              label: Titel für Suchmaschinen (optional)
            header.seodescription:
              type: textarea
              label: Beschreibung für Suchmaschinen (optional)
              rows: 2
            header.noindex:
              type: toggle
              label: Nicht in Suchmaschinen aufnehmen
              default: 0
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
        optionen:
          type: tab
          title: Veröffentlichung
          fields:
            header.published:
              type: toggle
              label: Veröffentlicht
              default: 1
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
