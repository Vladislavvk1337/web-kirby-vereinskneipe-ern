# Admin2-Formular für Seiten mit Template „contact“ (Theme kneipe).
title: Kontakt
form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        inhalt:
          type: tab
          title: Inhalt
          fields:
            admin:
              type: display
              markdown: true
              content: Adresse, E-Mail, Telefon und Öffnungszeiten stehen auf der Seite **Einstellungen** (nur Administration).
            header.title:
              type: text
              label: Titel
              autofocus: true
              validate:
                required: true
            header.intro:
              type: textarea
              label: Einleitung
              rows: 3
            content:
              type: markdown
              label: Anfahrt
              validate:
                type: textarea
                max: 0
            header.accessibility:
              type: textarea
              label: Zugang (Barrierefreiheit)
              rows: 3
            header.seotitle:
              type: text
              label: Titel für Suchmaschinen (optional)
            header.seodescription:
              type: textarea
              label: Beschreibung für Suchmaschinen (optional)
              rows: 2
            header.noindex:
              type: toggle
              label: Nicht in Suchmaschinen aufnehmen
              default: 0
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
        optionen:
          type: tab
          title: Veröffentlichung
          fields:
            header.published:
              type: toggle
              label: Veröffentlicht
              default: 1
              highlight: 1
              options:
                1: Ja
                0: Nein
              validate:
                type: bool
