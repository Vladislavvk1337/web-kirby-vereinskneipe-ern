# ==========================================================================
# Apache-Site für Grav im Container (Port ${APACHE_PORT}, TLS am Ingress).
# Die Regeln entsprechen webserver-configs/htaccess.txt von Grav 2.2 und
# sind hier fest eingebaut (AllowOverride None – keine .htaccess).
# ==========================================================================
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
LimitRequestBody ${KNEIPE_REQUEST_BODY_LIMIT}

<VirtualHost *:${APACHE_PORT}>
	DocumentRoot /var/www/grav

	ErrorLog /proc/self/fd/2
	LogLevel warn

	# Zugriffsprotokoll nur auf Wunsch (KNEIPE_ACCESS_LOG=true) – der
	# Ingress protokolliert in der Regel bereits. Ohne Cookies und Query.
	<IfDefine KNEIPE_ACCESS_LOG>
		LogFormat "%a %t \"%m %U %H\" %>s %b %D \"%{User-Agent}i\"" kneipe
		CustomLog /proc/self/fd/1 kneipe
	</IfDefine>

	# Echte Client-IP hinter Ingress/Load-Balancer (Rate-Limit, Anmeldesperre)
	RemoteIPHeader X-Forwarded-For
	RemoteIPInternalProxy ${KNEIPE_TRUSTED_PROXIES}

	# PHP für die Website härten (die Kommandozeile bleibt für Wartung frei)
	php_admin_value open_basedir "${KNEIPE_OPEN_BASEDIR}"
	php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid"
	php_admin_flag allow_url_include off

	<Directory /var/www/grav>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		RewriteEngine On

		# Versteckte Dateien nie ausliefern – außer .well-known
		RewriteRule (^|/)\.(?!well-known/) - [R=404,L]

		# Interne Verzeichnisse
		RewriteRule ^(cache|bin|logs|backup|tmp|tests|webserver-configs)(/|$) - [R=404,L]
		RewriteRule ^user/(config|env|accounts|data)(/|$) - [R=404,L]
		# Anfragen und Einstellungen: nie direkt, auch keine Dateien
		RewriteRule ^user/pages/(anfragen|einstellungen)(/|$) - [R=404,L]

		# Keine Skripte in den Cache-Ordnern für Bilder und Assets
		RewriteRule ^(images|assets)/.*\.(php\d?|phar|phtml|pht|phtm|phps|pl|py|cgi|sh|bat)$ - [R=404,L,NC]
		# Keine Quell- und Konfigurationsdateien aus system, vendor und user
		RewriteRule ^(system|vendor)/.*\.(txt|xml|md|html?|shtml?|json|ya?ml|php\d?|phar|phtml|pl|py|cgi|twig|sh|bat)$ - [R=404,L,NC]
		RewriteRule ^user/.*\.(txt|md|json|ya?ml|php\d?|phar|phtml|pl|py|cgi|twig|sh|bat)$ - [R=404,L,NC]
		RewriteRule ^(LICENSE\.txt|composer\.(json|lock)|setup\.php|.*\.md|.*\.env)$ - [R=404,L,NC]

		# Alles, was keine vorhandene Datei ist, beantwortet Grav
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule ^ index.php [L]
	</Directory>

	# Nur index.php darf als PHP laufen
	<FilesMatch "\.(php\d?|phtml|phar|inc)$">
		Require all denied
	</FilesMatch>
	<Files "index.php">
		Require all granted
	</Files>

	# ---------------------------------------------------------------------
	# Sicherheits-Header
	# ---------------------------------------------------------------------
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
	Header always set Cross-Origin-Opener-Policy "same-origin"
	Header always unset X-Powered-By

	# THE_REQUEST ist die ursprüngliche Anfragezeile – REQUEST_URI wäre nach
	# dem internen Rewrite auf index.php bereits „/index.php“
	<If "%{THE_REQUEST} =~ m#^\S+ /(admin|api)([/?\s]|$)#">
		# Admin2 (SvelteKit): Startkonfiguration als Inline-Skript, Plugin-
		# Seiten als blob:-Modul, Inline-Styles der Komponenten
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
		Header always set Cache-Control "no-store"
		Header always set X-Robots-Tag "noindex, nofollow"
	</If>
	<Else>
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
	</Else>

	# Staging: Suchmaschinen aussperren (KNEIPE_NOINDEX=true)
	<IfDefine KNEIPE_NOINDEX>
		Header always set X-Robots-Tag "noindex, nofollow"
	</IfDefine>

	# Caching statischer Dateien (Theme-Dateien tragen ?v=…)
	<LocationMatch "^/user/(themes|plugins)/">
		Header set Cache-Control "public, max-age=604800"
	</LocationMatch>
	<LocationMatch "^/user/plugins/admin2/app/_app/immutable/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
	<LocationMatch "^/(images|user/pages)/">
		Header set Cache-Control "public, max-age=2592000"
	</LocationMatch>

	# Kompression
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/css text/calendar application/javascript text/javascript application/json application/xml image/svg+xml
	</IfModule>
</VirtualHost>
