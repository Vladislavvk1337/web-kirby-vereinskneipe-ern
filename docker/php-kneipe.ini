; PHP-Einstellungen im Container – Werte aus Umgebungsvariablen (Docker.md).
; Weitere Härtung für Web-Anfragen: docker/apache-kneipe.conf (php_admin_*).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = 2000
file_uploads = On
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

date.timezone = ${KIRBY_TIMEZONE}
default_charset = "UTF-8"

; Kirby nutzt eigene Sitzungen; PHP-Sitzungen trotzdem sicher einstellen
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.save_path = /tmp

; Programmcode im Image ändert sich nicht – Zeitstempel nicht prüfen
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
realpath_cache_size = 4096K
realpath_cache_ttl = 600
