# ==========================================================================
# Apache-Site für Kirby im Container (Port ${APACHE_PORT}, TLS am Ingress).
# Entspricht deploy/caddy/Caddyfile: gleiche Sperren, Header und CSP.
# ==========================================================================
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
LimitRequestBody 13631488

<VirtualHost *:${APACHE_PORT}>
	DocumentRoot /var/www/html

	ErrorLog /proc/self/fd/2
	LogLevel warn

	# Zugriffsprotokoll nur auf Wunsch (KNEIPE_ACCESS_LOG=true) – der
	# Ingress protokolliert in der Regel bereits. Ohne Cookies und Query.
	<IfDefine KNEIPE_ACCESS_LOG>
		LogFormat "%a %t \"%m %U %H\" %>s %b %D \"%{User-Agent}i\"" kneipe
		CustomLog /proc/self/fd/1 kneipe
	</IfDefine>

	# Echte Client-IP hinter Ingress/Load-Balancer (Rate-Limit, Anmeldesperre)
	RemoteIPHeader X-Forwarded-For
	RemoteIPInternalProxy ${KNEIPE_TRUSTED_PROXIES}

	# PHP für die Website härten (die Kommandozeile bleibt für Wartung frei)
	php_admin_value open_basedir "${KNEIPE_OPEN_BASEDIR}"
	php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid"
	php_admin_flag allow_url_fopen off
	php_admin_flag allow_url_include off

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		RewriteEngine On

		# Versteckte Dateien nie ausliefern – außer .well-known
		RewriteRule (^|/)\.(?!well-known/) - [R=404,L]

		# Interne Verzeichnisse und Dateien sperren
		RewriteRule ^(content|site|kirby|vendor|bin|storage|data)(/|$) - [R=404,L]
		RewriteRule ^(composer\.(json|lock)|.*\.md|.*\.env)$ - [R=404,L]

		# In Assets und Medien wird nie PHP ausgeführt
		RewriteRule ^(assets|media)/.*\.(php|phtml|phar|inc)$ - [R=404,L]

		# Alles, was keine vorhandene Datei ist, beantwortet Kirby
		# (auch fehlende Vorschaubilder unter /media)
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^ index.php [L]
	</Directory>

	# Nur index.php darf als PHP laufen
	<FilesMatch "\.(php|phtml|phar|inc)$">
		Require all denied
	</FilesMatch>
	<Files "index.php">
		Require all granted
	</Files>

	# ---------------------------------------------------------------------
	# Sicherheits-Header
	# ---------------------------------------------------------------------
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
	Header always set Cross-Origin-Opener-Policy "same-origin"
	Header always unset X-Powered-By

	# THE_REQUEST ist die ursprüngliche Anfragezeile – REQUEST_URI wäre nach
	# dem internen Rewrite auf index.php bereits „/index.php“
	<If "%{THE_REQUEST} =~ m#^\S+ /(panel|api)([/?\s]|$)#">
		# Kirby-Panel braucht Inline-Styles und -Skripte (Vue)
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
		Header always set Cache-Control "no-store"
	</If>
	<Else>
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
	</Else>

	# Vorschau/Staging: Suchmaschinen aussperren (KIRBY_NOINDEX=true)
	<IfDefine KNEIPE_NOINDEX>
		Header always set X-Robots-Tag "noindex, nofollow"
	</IfDefine>

	# Caching statischer Dateien
	<LocationMatch "^/assets/">
		Header set Cache-Control "public, max-age=604800"
	</LocationMatch>
	<LocationMatch "^/media/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>

	# Kompression
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/css text/calendar application/javascript application/json application/xml image/svg+xml
	</IfModule>
</VirtualHost>
