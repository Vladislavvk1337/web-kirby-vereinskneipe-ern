# Logos von Thekenteams. SVG ist erlaubt – Kirby prüft SVG-Dateien beim
# Hochladen auf Skripte und externe Verweise und lehnt unsichere ab.
title: Logo
accept:
  mime:
    - image/jpeg
    - image/png
    - image/webp
    - image/svg+xml
  maxsize: 2000000
fields:
  alt:
    label: Alternativtext
    type: text
    help: In der Regel „Logo von …“.
