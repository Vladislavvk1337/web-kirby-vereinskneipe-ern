# Fotos und Grafiken für Termine, Teams, Beiträge und Seiten
title: Bild
accept:
  mime:
    - image/jpeg
    - image/png
    - image/webp
    - image/avif
  maxsize: 10000000
  maxwidth: 8000
  maxheight: 8000
columns:
  main:
    width: 2/3
    fields:
      alt:
        label: Alternativtext
        type: text
        maxlength: 180
        help: Was ist auf dem Bild zu sehen? Ein kurzer Satz für Menschen, die das Bild nicht sehen können.
        when:
          decorative: false
      decorative:
        label: Rein dekorativ
        type: toggle
        default: false
        text:
          - Nein, Bild trägt Inhalt
          - Ja, ohne Alternativtext ausgeben
      caption:
        label: Bildunterschrift
        type: text
      credit:
        label: Foto/Urheber
        type: text
        help: Wird unter dem Bild genannt, z. B. „Foto: Vorname Nachname“.
  sidebar:
    width: 1/3
    fields:
      consent:
        label: Einwilligung abgebildeter Personen
        type: select
        default: keinepersonen
        options:
          keinepersonen: Keine erkennbaren Personen
          liegtvor: Einwilligung liegt vor
          ausstehend: Einwilligung fehlt noch – nicht verwenden
      consentnote:
        label: Nachweis der Einwilligung
        type: textarea
        buttons: false
        help: Wo ist die Einwilligung abgelegt (z. B. Ordner, Datum)? Nur intern.
        when:
          consent: liegtvor
