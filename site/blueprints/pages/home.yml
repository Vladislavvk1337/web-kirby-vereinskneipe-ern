title: Startseite
icon: home
extends: options/admin-only

tabs:
  content:
    label: Inhalt
    icon: home
    columns:
      main:
        width: 2/3
        fields:
          intro:
            label: Kurze Erklärung im Hero
            type: textarea
            buttons: false
            maxlength: 320
            counter: true
            help: Leitzeile und Name kommen aus den Stammdaten.
          modelheadline:
            label: Überschrift „So funktioniert’s“
            type: text
          modelsteps:
            label: Schritte des Ehrenamtsmodells
            type: structure
            max: 4
            fields:
              title:
                label: Titel
                type: text
              text:
                label: Text
                type: textarea
                buttons: false
          photo:
            label: Bild für den Bildbereich
            type: files
            multiple: false
            query: page.images
            uploads: image
          photocaption:
            label: Text zum Bild
            type: textarea
            buttons: false
          joinheadline:
            label: Überschrift „Mitmachen“
            type: text
          jointext:
            label: Text „Mitmachen“
            type: textarea
            buttons: false
      sidebar:
        width: 1/3
        sections:
          images: sections/images
  seo: tabs/seo
