title: Meldung oder Rückblick
icon: text
num: '{{ page.date.toDate("Ymd") }}'

status:
  draft:
    label: Entwurf
    text: Nur im Panel sichtbar.
  listed:
    label: Veröffentlicht
    text: Unter „Aktuelles“ sichtbar.

options:
  changeTemplate: false
  move: false

create:
  title:
    label: Überschrift
  fields:
    - kind
    - date
  status: draft
  redirect: true

tabs:
  content:
    label: Beitrag
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          kind:
            label: Art
            type: select
            default: meldung
            required: true
            width: 1/2
            options:
              meldung: Meldung
              rueckblick: Rückblick
          date:
            label: Datum
            type: date
            display: DD.MM.YYYY
            default: today
            required: true
            width: 1/2
          teaser:
            label: Kurzfassung
            type: textarea
            buttons: false
            maxlength: 300
            counter: true
          text:
            extends: fields/richtext
            label: Text
          event:
            label: Zugehöriger Termin
            type: pages
            multiple: false
            query: site.find('termine').children
            help: Optional – z. B. der Abend, über den berichtet wird.
      sidebar:
        width: 1/3
        sections:
          media:
            type: fields
            fields:
              cover: fields/cover
              gallery: fields/gallery
          images: sections/images
  seo: tabs/seo
  history: tabs/history
