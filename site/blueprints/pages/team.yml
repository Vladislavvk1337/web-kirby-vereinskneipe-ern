title: Thekenteam
icon: users
num: zero

status:
  draft:
    label: Entwurf
    text: Nur im Panel sichtbar.
  listed:
    label: Veröffentlicht
    text: Öffentlich – aber nur, wenn die Einwilligung zur Veröffentlichung vorliegt.

options:
  changeTemplate: false
  move: false

create:
  title:
    label: Teamname
  fields:
    - teamtype
  status: draft
  redirect: true

tabs:
  content:
    label: Team
    icon: users
    columns:
      main:
        width: 2/3
        fields:
          teamtype:
            label: Teamart
            type: select
            required: true
            options:
              verein: Verein
              unternehmen: Unternehmen
              initiative: Initiative
              privat: Private Gruppe
            width: 1/2
          consent:
            label: Einwilligung zur Veröffentlichung
            type: toggle
            width: 1/2
            text:
              - Liegt nicht vor – Team bleibt intern
              - Liegt vor – Team darf öffentlich erscheinen
            help: Ohne Einwilligung erscheint weder Name noch Logo auf der Website.
          consentnote:
            label: Nachweis der Einwilligung
            type: text
            help: Datum und Ablage, z. B. „E-Mail vom 03.09.2026, Ordner Thekenteams“. Nur intern.
            when:
              consent: true
          teaser:
            label: Kurzbeschreibung
            type: textarea
            buttons: false
            maxlength: 280
            counter: true
          text:
            extends: fields/richtext
            label: Ausführliche Vorstellung
          website:
            label: Öffentliche Website
            type: url
          social:
            label: Öffentliche Social-Media-Links
            type: structure
            columns:
              platform:
                width: 1/3
              url:
                width: 2/3
            fields:
              platform:
                label: Plattform
                type: text
                placeholder: z. B. Instagram
              url:
                label: Adresse
                type: url
      sidebar:
        width: 1/3
        sections:
          media:
            type: fields
            fields:
              logo:
                label: Logo
                type: files
                multiple: false
                query: page.files.template('logo')
                uploads: logo
              cover: fields/cover
              gallery: fields/gallery
          images: sections/images
          internal:
            type: fields
            fields:
              internalheadline:
                type: headline
                label: Intern – nie öffentlich
                help: Diese Angaben erscheinen nirgends auf der Website.
              contactperson:
                label: Kontaktperson
                type: text
              contactemail:
                label: E-Mail (intern)
                type: email
              contactphone:
                label: Telefon (intern)
                type: tel
              internalnote:
                label: Interne Notiz
                type: textarea
                buttons: false
                size: small
  events:
    label: Termine
    icon: calendar
    sections:
      upcoming:
        type: pages
        headline: Kommende Termine dieses Teams
        query: page.panelUpcomingEvents
        create: false
        layout: table
        empty: Keine kommenden Termine.
        columns:
          start:
            label: Beginn
            value: "{{ page.start.toDate('d.m.Y H:i') }}"
          orgstatus:
            label: Status
      past:
        type: pages
        headline: Vergangene Termine
        query: page.panelPastEvents
        create: false
        layout: table
        empty: Noch keine vergangenen Termine.
        columns:
          start:
            label: Beginn
            value: "{{ page.start.toDate('d.m.Y H:i') }}"
          orgstatus:
            label: Status
  seo: tabs/seo
  history: tabs/history
