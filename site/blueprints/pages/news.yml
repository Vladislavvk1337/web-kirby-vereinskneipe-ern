title: Aktuelles-Übersicht
icon: text
extends: options/container

tabs:
  articles:
    label: Beiträge
    icon: text
    sections:
      drafts:
        type: pages
        headline: Entwürfe
        status: draft
        template: article
        empty: Keine Entwürfe.
        info: "{{ page.date.toDate('d.m.Y') }}"
      published:
        type: pages
        headline: Veröffentlicht
        status: listed
        template: article
        sortBy: date desc
        info: "{{ page.date.toDate('d.m.Y') }} · {{ page.kind }}"
        layout: list
  page:
    label: Seitentext
    icon: text
    fields:
      intro:
        label: Einleitung
        type: textarea
        buttons: false
        size: small
  seo: tabs/seo
