    width: 2/3
    fields:
      info:
        type: info
        label: Hinweis
        text: Adresse, Öffnungszeiten, E-Mail und Telefon kommen aus den Stammdaten (Übersicht → Stammdaten).
      intro:
        label: Einleitung
        type: textarea
        buttons: false
      directions:
        extends: fields/richtext
        label: Anfahrt und Parken
      accessibility:
        label: Zugang und Barrieren vor Ort
        type: textarea
        buttons: false
