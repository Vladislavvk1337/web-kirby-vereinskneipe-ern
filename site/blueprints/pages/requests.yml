title: Terminanfragen
icon: email

# Nur Administration und Moderation. Anfragen entstehen ausschließlich über
# das öffentliche Formular und werden nie veröffentlicht.
options:
  update: false
  changeSlug: false
  changeStatus: false
  changeTitle: false
  changeTemplate: false
  delete: false
  duplicate: false
  move: false
  sort: false
  preview: false

sections:
  info:
    type: info
    headline: Datenschutz
    text: "Anfragen enthalten personenbezogene Daten. Sie werden automatisch nach {{ site.retentiondays.or('180') }} Tagen gelöscht. Nur die Administration kann Anfragen vorher löschen. Keine Daten aus Anfragen in öffentliche Felder übernehmen, ohne dass die Gruppe zugestimmt hat."
  open:
    type: pages
    headline: Neu und in Bearbeitung
    query: site.dashboardRequests
    create: false
    layout: table
    empty: Keine offenen Anfragen.
    columns:
      submittedat:
        label: Eingang
        value: "{{ page.submittedat.toDate('d.m.Y H:i') }}"
      slotlabel:
        label: Wunschtermin
      processing:
        label: Bearbeitung
  all:
    type: pages
    headline: Alle Anfragen
    status: draft
    template: request
    create: false
    sortBy: submittedat desc
    layout: table
    limit: 30
    columns:
      submittedat:
        label: Eingang
        value: "{{ page.submittedat.toDate('d.m.Y H:i') }}"
      processing:
        label: Bearbeitung
