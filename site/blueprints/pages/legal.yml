title: Rechtstext
icon: document
extends: options/admin-only

columns:
  main:
    width: 2/3
    fields:
      draftnote:
        label: Prüfhinweis anzeigen
        type: toggle
        default: true
        text:
          - Nein, Text ist geprüft
          - Ja, „Entwurf – rechtlich noch nicht geprüft“ anzeigen
      text:
        label: Text
        type: textarea
        size: huge
        help: "KirbyText. Stammdaten einfügen mit (stammdaten: street), (stammdaten: email) usw. – fehlende Werte erscheinen als markierter Platzhalter."
  sidebar:
    width: 1/3
    fields:
      reviewed:
        label: Zuletzt geprüft am
        type: date
        display: DD.MM.YYYY
      seo: fields/seo
