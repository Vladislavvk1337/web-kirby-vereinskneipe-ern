# Wiederverwendbare SEO-Felder – Einbindung: seo: fields/seo
type: group
fields:
  seoheadline:
    type: headline
    label: Suchmaschinen und Teilen
    help: Leer lassen, dann werden Titel und Kurzbeschreibung verwendet.
  seotitle:
    label: SEO-Titel
    type: text
    maxlength: 70
    counter: true
    help: Erscheint im Browser-Tab und bei Suchmaschinen (ideal 50–60 Zeichen).
  seodescription:
    label: Meta-Beschreibung
    type: textarea
    buttons: false
    maxlength: 170
    counter: true
    help: Ein bis zwei Sätze für die Trefferliste von Suchmaschinen (ideal 120–160 Zeichen).
  ogimage:
    label: Social-Sharing-Bild
    type: files
    multiple: false
    query: page.images
    uploads: image
    help: Wird beim Teilen in Messengern angezeigt (ideal 1200 × 630 px). Leer = Titelbild bzw. Standardbild.
  noindex:
    label: Von Suchmaschinen ausschließen
    type: toggle
    text:
      - Nein
      - Ja, nicht indexieren
