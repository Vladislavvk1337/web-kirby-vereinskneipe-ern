# Änderungsprotokoll eines Termins – nur lesbar, wird per Hook ergänzt
label: Änderungsprotokoll
type: structure
disabled: true
sortBy: date desc
limit: 20
help: Jede Speicherung und jede Veröffentlichung wird mit Person, Zeitpunkt und geänderten Feldern festgehalten.
columns:
  date:
    width: 1/6
  user:
    width: 1/4
  status:
    width: 1/8
  changes:
    width: 1/3
  note:
    width: 1/4
fields:
  date:
    label: Zeitpunkt
    type: date
    time: true
    display: DD.MM.YYYY
  user:
    label: Person
    type: text
  status:
    label: Zustand
    type: text
  changes:
    label: Änderung
    type: text
  note:
    label: Notiz
    type: text
