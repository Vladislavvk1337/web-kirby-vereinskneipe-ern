# Stammdaten – nur Administration. Leere Felder erscheinen auf der
# Website als deutlich markierter Platzhalter (siehe docs/project-data-needed.md).
label: Stammdaten
icon: home
columns:
  - width: 1/2
    fields:
      identityheadline:
        type: headline
        label: Name und Auftritt
        help: Der Name der Kneipe ist der Seitentitel oben links („Ehrenamtskneipe“ anklicken, um ihn zu ändern).
      claim:
        label: Leitzeile
        type: text
        placeholder: Von Erndtebrück. Für Erndtebrück. Zusammen.
      description:
        label: Kurzbeschreibung
        type: textarea
        buttons: false
        maxlength: 300
        counter: true
        help: Für die Startseite, Suchmaschinen und das Teilen.
      ogimage:
        label: Standard-Bild zum Teilen
        type: files
        multiple: false
        uploads: image
        help: 1200 × 630 px. Leer = Vorlage aus assets/brand/og-default.png.
      placeheadline:
        type: headline
        label: Ort
      venue:
        label: Name des Veranstaltungsorts
        type: text
        placeholder: z. B. Name des Hauses oder Raums
      street:
        label: Straße und Hausnummer
        type: text
        width: 1/2
      postalcode:
        label: PLZ
        type: text
        width: 1/4
      city:
        label: Ort
        type: text
        width: 1/4
      latitude:
        label: Breitengrad
        type: text
        width: 1/2
        help: Für den Kartenlink, z. B. 50.99
      longitude:
        label: Längengrad
        type: text
        width: 1/2
  - width: 1/2
    fields:
      contactheadline:
        type: headline
        label: Kontakt und Öffnungszeiten
      email:
        label: Allgemeine E-Mail-Adresse
        type: email
      phone:
        label: Telefonnummer
        type: tel
      openinghours:
        label: Reguläre Öffnungszeiten
        type: structure
        columns:
          days:
            width: 1/3
          time:
            width: 1/3
          note:
            width: 1/3
        fields:
          days:
            label: Tag(e)
            type: text
          time:
            label: Uhrzeit
            type: text
          note:
            label: Hinweis
            type: text
      openingnote:
        label: Hinweis zu den Öffnungszeiten
        type: text
        help: z. B. „Geöffnet an allen veröffentlichten Terminen.“
      social:
        label: Social-Media-Links
        type: structure
        fields:
          platform:
            label: Plattform
            type: text
          url:
            label: Adresse
            type: url
      legalheadline:
        type: headline
        label: Angaben für Impressum und Datenschutz
      operator:
        label: Betreiber/Träger (Name und Rechtsform)
        type: text
      legalrepresentative:
        label: Vertretungsberechtigte Person(en)
        type: text
      legalregister:
        label: Registereintrag
        type: text
        placeholder: z. B. Vereinsregister, Amtsgericht …, VR …
      legalresponsible:
        label: Verantwortlich nach § 18 Abs. 2 MStV
        type: text
      legalhoster:
        label: Hosting-Anbieter (Name, Anschrift)
        type: text
      legalmailprovider:
        label: E-Mail-Anbieter (Name, Anschrift)
        type: text
